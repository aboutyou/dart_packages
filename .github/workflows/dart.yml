name: Dart CI

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.package }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-15]
        package:
          [
            pending_operations,
            sign_in_with_apple/sign_in_with_apple_platform_interface,
            state_queue_test,
            state_queue,
            with_bloc,
          ]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          # Deliberately pinned to an older Flutter — these packages don't use newer features.
          flutter-version: "3.35.0"
      - name: Install dependencies
        run: flutter packages get
        working-directory: packages/${{ matrix.package }}
      - name: Analyze
        run: flutter analyze
        working-directory: packages/${{ matrix.package }}
      - name: Format
        run: dart format --set-exit-if-changed .
        working-directory: packages/${{ matrix.package }}
      - name: Run tests
        run: flutter test --coverage
        working-directory: packages/${{ matrix.package }}
      - name: Upload coverage to Codecov
        if: startsWith(matrix.os, 'macos')
        uses: codecov/codecov-action@v1.0.6
        with:
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          fail_ci_if_error: false

  test-siwa:
    name: Test ${{ matrix.package }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Single platform: golden rendering differs slightly across OSes and even
        # macOS versions. Goldens are (re)generated locally on the maintainers'
        # macOS machines, so they are checked on the matching macOS runner.
        os: [macos-26]
        package: [sign_in_with_apple/sign_in_with_apple]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          # Pinned to a single Flutter version to avoid golden file drift across versions.
          flutter-version: "3.44.0"
      - name: Install dependencies
        run: flutter packages get
        working-directory: packages/${{ matrix.package }}
      - name: Analyze
        run: flutter analyze
        working-directory: packages/${{ matrix.package }}
      - name: Format
        run: dart format --set-exit-if-changed .
        working-directory: packages/${{ matrix.package }}
      - name: Run tests
        run: flutter test --coverage
        working-directory: packages/${{ matrix.package }}
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v1.0.6
        with:
          flags: ${{ matrix.package }}
          name: ${{ matrix.package }}
          fail_ci_if_error: false

  build-ios:
    name: Build ${{ matrix.package }} iOS on ${{ matrix.os }} with Xcode ${{ matrix.xcode }} and Flutter ${{ matrix.flutter }} with Cocoapods (default)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]
        package: [sign_in_with_apple/sign_in_with_apple]
        xcode: ["16.4", "26.4.1"]
        flutter: ["3.44.0"]
        exclude:
          - os: macos-15
            xcode: 26.4.1
          - os: macos-26
            xcode: 16.4
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - name: Xcode select
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          flutter-version: ${{ matrix.flutter }}
      - name: Flutter doctor (version check)
        run: flutter doctor
      - name: Build iOS
        run: flutter build ios --no-codesign
        working-directory: packages/${{ matrix.package }}/example
        env:
          OTHER_SWIFT_FLAGS: "-warnings-as-errors"
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

  build-ios-spm:
    name: Build ${{ matrix.package }} iOS on ${{ matrix.os }} with Xcode ${{ matrix.xcode }} and Flutter ${{ matrix.flutter }} with SPM
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]
        package: [sign_in_with_apple/sign_in_with_apple]
        xcode: ["16.4", "26.4.1"]
        flutter: ["3.44.0"]
        exclude:
          - os: macos-15
            xcode: 26.4.1
          - os: macos-26
            xcode: 16.4
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - name: Xcode select
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          flutter-version: ${{ matrix.flutter }}
      - name: Flutter doctor (version check)
        run: flutter doctor
      - name: Enable SPM support
        run: flutter config --enable-swift-package-manager
        working-directory: packages/${{ matrix.package }}/example
      - name: List dependency config before (debug)
        run: |
          less ios/Runner.xcodeproj/project.pbxproj | grep Pods || echo ""
          less ios/Runner.xcodeproj/project.pbxproj | grep FlutterGeneratedPluginSwiftPackage || echo ""
        working-directory: packages/${{ matrix.package }}/example
      - name: Remove Cocoapods from project
        run: pod deintegrate
        working-directory: packages/${{ matrix.package }}/example/ios
      - name: Remove Cocoapods files
        run: rm -rf Pod*
        working-directory: packages/${{ matrix.package }}/example/ios
      - name: Build iOS
        run: flutter build ios --no-codesign
        working-directory: packages/${{ matrix.package }}/example
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      - name: List dependency config after (debug)
        run: |
          less ios/Runner.xcodeproj/project.pbxproj | grep Pods || echo ""
          less ios/Runner.xcodeproj/project.pbxproj | grep FlutterGeneratedPluginSwiftPackage || echo ""
        working-directory: packages/${{ matrix.package }}/example

  build-android:
    name: Build ${{ matrix.package }} Android on ${{ matrix.os }} and Flutter ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        package: [sign_in_with_apple/sign_in_with_apple]
        flutter: ["3.44.0"]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v2
        with:
          distribution: "zulu" # OpenJDK
          java-version: "17"
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          flutter-version: ${{ matrix.flutter }}
      - name: Build Android
        run: flutter build appbundle 2>&1 | tee build-output.log
        shell: bash
        working-directory: packages/${{ matrix.package }}/example
      - name: Ensure plugin is not flagged for applying the Kotlin Gradle Plugin (#483)
        run: "! grep 'plugins that apply Kotlin Gradle Plugin' build-output.log"
        working-directory: packages/${{ matrix.package }}/example

  # Readiness check for AGP 9's built-in Kotlin (#483): apps can only enable it on
  # Flutter >=3.47. Mutates the example app to what a migrated consumer looks like
  # (AGP 9, built-in Kotlin on, no kotlin-android in the app). The 3.44 lanes above
  # stay pinned to 3.44, which remains our minimum supported Flutter (see #493).
  build-android-built-in-kotlin:
    name: Build ${{ matrix.package }} Android with built-in Kotlin (AGP 9) on Flutter ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        package: [sign_in_with_apple/sign_in_with_apple]
        flutter: ["3.47.0"]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v2
        with:
          distribution: "zulu" # OpenJDK
          java-version: "21"
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          flutter-version: ${{ matrix.flutter }}
      - name: Migrate example app to AGP 9 with built-in Kotlin
        run: |
          perl -pi -e 's/id\("com\.android\.application"\) version "8\.11\.1"/id("com.android.application") version "9.3.1"/' android/settings.gradle.kts
          perl -pi -e 's/gradle-8\.14-all\.zip/gradle-9.6.1-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          perl -pi -e 's/android\.builtInKotlin=false/android.builtInKotlin=true/' android/gradle.properties
          perl -ni -e 'print unless /id\("kotlin-android"\)/' android/app/build.gradle.kts
          perl -0pi -e 's/[ \t]*kotlinOptions \{[^}]*\}\n\n//' android/app/build.gradle.kts
          printf '\nkotlin {\n    compilerOptions {\n        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17\n    }\n}\n' >> android/app/build.gradle.kts
        working-directory: packages/${{ matrix.package }}/example
      - name: Build Android
        run: flutter build appbundle 2>&1 | tee build-output.log
        shell: bash
        working-directory: packages/${{ matrix.package }}/example
      # Asserts the absence of the three KGP-related warnings: the plugin-list warning,
      # the app-side warning, and the failed KGP auto-apply note. (A plain 'KGP' grep is
      # too broad — Flutter's dependency version checker mentions KGP in informational
      # output on the built-in Kotlin path.)
      - name: Ensure no Kotlin Gradle Plugin warnings (#483)
        run: |
          ! grep -E 'plugins that apply Kotlin Gradle Plugin|applies the Kotlin Gradle Plugin|KGP\) was unsuccessful' build-output.log
        working-directory: packages/${{ matrix.package }}/example

  build-macos:
    name: Build ${{ matrix.package }} macOS on ${{ matrix.os }} with Xcode ${{ matrix.xcode }} and Flutter ${{ matrix.flutter }} with Cocoapods
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-15, macos-26]
        package: [sign_in_with_apple/sign_in_with_apple]
        xcode: ["16.4", "26.4.1"]
        flutter: ["3.44.0"]
        exclude:
          - os: macos-15
            xcode: 26.4.1
          - os: macos-26
            xcode: 16.4
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - name: Xcode select
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          flutter-version: ${{ matrix.flutter }}
      - name: Enable macOS Desktop Integration
        run: flutter config --enable-macos-desktop
      - name: Flutter doctor (version check)
        run: flutter doctor
      - name: Build macOS
        run: flutter build macos
        working-directory: packages/${{ matrix.package }}/example
        env:
          OTHER_SWIFT_FLAGS: "-warnings-as-errors"
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

  build-macos-spm:
    name: Build ${{ matrix.package }} macOS on ${{ matrix.os }} with Xcode ${{ matrix.xcode }} and Flutter ${{ matrix.flutter }} with SPM
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-26]
        package: [sign_in_with_apple/sign_in_with_apple]
        xcode: ["26.4.1"]
        flutter: ["3.44.0"]
    steps:
      - uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: "12.x"
      - name: Xcode select
        run: sudo xcode-select -s /Applications/Xcode_${{ matrix.xcode }}.app
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          flutter-version: ${{ matrix.flutter }}
      - name: Enable macOS Desktop Integration
        run: flutter config --enable-macos-desktop
      - name: Flutter doctor (version check)
        run: flutter doctor
      - name: Enable SPM support
        run: flutter config --enable-swift-package-manager
        working-directory: packages/${{ matrix.package }}/example
      - name: List dependency config before (debug)
        run: |
          less macos/Runner.xcodeproj/project.pbxproj | grep Pods || echo ""
          less macos/Runner.xcodeproj/project.pbxproj | grep FlutterGeneratedPluginSwiftPackage || echo ""
        working-directory: packages/${{ matrix.package }}/example
      - name: Remove Cocoapods from project
        run: pod deintegrate
        working-directory: packages/${{ matrix.package }}/example/macos
      - name: Remove Cocoapods files
        run: rm -rf Pod*
        working-directory: packages/${{ matrix.package }}/example/macos
      - name: Build macOS
        run: flutter build macos
        working-directory: packages/${{ matrix.package }}/example
        env:
          DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

  build-web:
    name: Build ${{ matrix.package }} Web on ${{ matrix.os }} and Flutter ${{ matrix.flutter }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
        package: [sign_in_with_apple/sign_in_with_apple]
        flutter: ["3.44.0"]
    steps:
      - uses: actions/checkout@v1
      - uses: subosito/flutter-action@4389e6cbc6cb8a4b18c628ff96ff90be0e926aa8 # v1.5.3
        with:
          flutter-version: ${{ matrix.flutter }}
      - name: Build Web
        run: flutter build web
        working-directory: packages/${{ matrix.package }}/example
