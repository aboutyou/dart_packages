group 'com.aboutyou.dart_packages.sign_in_with_apple'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// AGP 9 supplies Kotlin itself, and applying `kotlin-android` on top of it fails. But it only does so
// when built-in Kotlin is actually enabled: AGP 9 defaults `android.builtInKotlin` to true, and a
// consumer can still opt out with `android.builtInKotlin=false`, in which case this module has to
// bring `kotlin-android` along itself — otherwise nothing compiles the Kotlin sources.
def isAgp9OrAbove = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger() >= 9
def hasBuiltInKotlin = isAgp9OrAbove && project.findProperty('android.builtInKotlin')?.toString() != 'false'

apply plugin: 'com.android.library'
if (!hasBuiltInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdk 36

    namespace 'com.aboutyou.dart_packages.sign_in_with_apple'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // `kotlinOptions` is contributed by `kotlin-android`, so it only exists when that plugin is
    // applied above. Under AGP 9's built-in Kotlin the JVM target follows `compileOptions`.
    if (!hasBuiltInKotlin) {
        kotlinOptions {
            jvmTarget = '17'
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk 24
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
}
